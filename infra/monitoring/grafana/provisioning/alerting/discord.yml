apiVersion: 1

templates:
  - orgId: 1
    name: discord
    template: |
      {{ define "discord.title" }}{{ if eq .Status "firing" }}🔴{{ else }}🟢{{ end }} {{ .CommonLabels.alertname }}{{ if eq .Status "resolved" }} 복구{{ end }}{{ end }}

      {{ define "discord.message" }}{{ range .Alerts }}{{ .Annotations.summary }}
      {{ end }}{{ with index .Alerts 0 }}[규칙 보기]({{ .GeneratorURL }}){{ if eq .Status "firing" }} · [일시정지]({{ .SilenceURL }}){{ end }}{{ end }}{{ end }}

contactPoints:
  - orgId: 1
    name: discord
    receivers:
      - uid: discord
        type: discord
        settings:
          url: $DISCORD_WEBHOOK_URL
          title: '{{ template "discord.title" . }}'
          message: '{{ template "discord.message" . }}'
          use_discord_username: true

policies:
  - orgId: 1
    receiver: discord
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: radio-overload
        object_matchers: [["radio_overload", "=", "true"]]
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 5m
        continue: true
      - receiver: discord
        object_matchers: [["radio_overload", "=", "true"]]
