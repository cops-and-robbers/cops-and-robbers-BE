name: ✅ CI

on:
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: test_cnr
          POSTGRES_PASSWORD: test5678
          POSTGRES_DB: cops_test_db
        ports:
          - 5433:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U test_cnr -d cops_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:latest
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 50

    steps:
      - name: 🔄 소스 코드 가져오기
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🚫 main PR 소스 브랜치 검증
        if: github.base_ref == 'main'
        run: |
          SOURCE="${{ github.head_ref }}"
          if [[ "$SOURCE" == "dev" || "$SOURCE" == */hotfix-* ]]; then
            echo "✅ 허용된 브랜치: $SOURCE"
          else
            echo "❌ main으로는 dev 또는 {name}/hotfix-{이슈번호} 브랜치만 허용합니다."
            echo "개인 브랜치는 dev로 먼저 PR 올려주세요."
            exit 1
          fi

      - name: 📋 Swagger 버전 업데이트 검증
        run: |
          git fetch origin ${{ github.base_ref }}

          DOCS_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '.*ControllerDocs\.java$' || true)

          if [ -n "$DOCS_CHANGED" ]; then
            SWAGGER_CHANGED=$(git diff origin/${{ github.base_ref }}...HEAD -- src/main/java/com/team/cops_and_robbers/common/swagger/SwaggerConfig.java | grep '^+' | grep -v '^+++' || true)
            if [ -z "$SWAGGER_CHANGED" ]; then
              echo "❌ ControllerDocs.java가 변경됐는데 SwaggerConfig.java의 버전이 업데이트되지 않았습니다."
              echo "변경된 파일:"
              echo "$DOCS_CHANGED"
              exit 1
            fi
            echo "✅ Swagger 버전이 업데이트되었습니다."
          else
            echo "✅ ControllerDocs 변경 없음 — Swagger 버전 검사 생략."
          fi


      - name: 📝 테스트용 Firebase 더미 키 생성
        run: |
          mkdir -p src/test/resources
          echo '{"type": "service_account", "project_id": "test"}' > src/test/resources/dummy-firebase-key.json

      - name: ☕ JDK 21 설치
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: 🐘 Gradle 테스트
        run: |
          chmod +x gradlew
          ./gradlew test
