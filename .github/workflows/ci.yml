name: ✅ CI

on:
  pull_request:
    branches: [ "main" ] # main으로 향하는 PR일 경우 실행

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: test_cnr
          POSTGRES_PASSWORD: test5678
          POSTGRES_DB: cops_test_db
        ports:
          - 5433:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U test_cnr -d cops_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:latest
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 50

    steps:
      - name: 🔄 소스 코드 가져오기
        uses: actions/checkout@v3

      - name: 📝 테스트용 Firebase 더미 키 생성
        run: |
          mkdir -p src/test/resources
          echo '{"type": "service_account", "project_id": "test"}' > src/test/resources/dummy-firebase-key.json

      - name: ☕ JDK 21 설치
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: 🐘 Gradle 테스트
        run: |
          chmod +x gradlew
          ./gradlew test
