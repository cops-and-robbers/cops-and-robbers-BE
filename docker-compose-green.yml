version: '3.8'

services:
  cops-and-robbers-green:
    image: copsnro66ers/cops-and-robbers:latest
    container_name: cops-and-robbers-green
    ports:
      - "127.0.0.1:8081:8080"
      - "9092:9091"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul

      FIREBASE_KEY_PATH: /app/firebase-key.json

      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: cops-and-robbers-redis
      REDIS_PORT: 6379

      ACCESS_SECRET_KEY: ${ACCESS_SECRET_KEY}
      REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY}
      ACCESS_EXPIRATION: ${ACCESS_EXPIRATION}
      REFRESH_EXPIRATION: ${REFRESH_EXPIRATION}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

    volumes:
      - ./firebase-key.json:/app/firebase-key.json
      - /home/ubuntu/log:/log

    networks:
      - cops-network
    restart: unless-stopped

networks:
  cops-network:
    external: true