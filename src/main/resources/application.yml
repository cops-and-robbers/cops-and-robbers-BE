spring:
  application:
    name: cops-and-robbers

  lifecycle:
    timeout-per-shutdown-phase: 60s

  graphql:
    graphiql:
      enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true
    encoding: UTF-8

  http:
    client:
      # VWorld 실측이 0.05초, 터널 경유 dev에서도 0.5초 미만이다.
      # 실패 시 Geoapify로 넘어가고 한국·일본은 언어를 맞추려 한 번 더 부르므로,
      # 이 값의 3배까지 사용자가 기다린다. 넉넉히 잡으면 장애를 늦게 알아챌 뿐이다.
      connect-timeout: 2s
      read-timeout: 2s

jwt:
  access:
    secret: ${ACCESS_SECRET_KEY}
    expiration: ${ACCESS_EXPIRATION}
  refresh:
    secret: ${REFRESH_SECRET_KEY}
    expiration: ${REFRESH_EXPIRATION}

springdoc:
  swagger-ui:
    path: /docs/swagger
    display-request-duration: true
    persist-authorization: true
    filter: true

encryption:
  secret-key: ${ENCRYPTION_KEY}

geocoding:
  vworld:
    api-key: ${VWORLD_API_KEY:}
  geoapify:
    api-key: ${GEOAPIFY_API_KEY:}

discord:
  webhook:
    bug: ${DISCORD_WEBHOOK_BUG}
    alert: ${DISCORD_WEBHOOK_ALERT:}

server:
  shutdown: graceful

management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
